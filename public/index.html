<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f5257">
<title>PG Mate</title>
<style>
:root{--bg:#f3f6f6;--card:#fff;--ink:#16292b;--mute:#5d7274;--line:#d9e3e3;--brand:#0f5257;--on:#fff;--warn:#b45309;--ok:#15803d}
@media(prefers-color-scheme:dark){:root{--bg:#0d1718;--card:#142224;--ink:#e6f0f0;--mute:#8fa6a8;--line:#244043;--brand:#4fb3b8;--on:#06191a;--warn:#f59e0b;--ok:#4ade80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(72px + env(safe-area-inset-bottom,0px))}
header{background:var(--brand);color:var(--on);padding:calc(14px + env(safe-area-inset-top,0px)) 16px 14px;display:flex;justify-content:space-between;align-items:center}
header b{font-size:18px}header small{opacity:.85;display:block}
main{max-width:640px;margin:0 auto;padding:12px 16px}
h2{font-size:17px;margin:20px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px}
label{display:block;font-size:14px;color:var(--mute);margin:8px 0 3px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
button{background:var(--brand);color:var(--on);border:0;border-radius:8px;padding:10px 14px;font:inherit;font-weight:600;margin-top:10px;cursor:pointer}
button.ghost{background:transparent;color:var(--brand);border:1px solid var(--brand)}
button.sm{padding:6px 10px;margin:0;font-size:14px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0}
.row+.row{border-top:1px solid var(--line)}
.tag{font-size:13px;padding:2px 8px;border-radius:99px;border:1px solid currentColor}
.Pending,.Open{color:var(--warn)}.Paid,.Fixed{color:var(--ok)}.Inprogress{color:var(--brand)}
small,.mute{color:var(--mute)}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;color:var(--mute);border-radius:0;margin:0;padding:12px 2px;font-size:13px}
nav button.on{color:var(--brand);box-shadow:inset 0 3px 0 var(--brand)}
.tabs{display:flex;gap:6px;margin-bottom:8px}.tabs button{flex:1;margin:0}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;display:none;max-width:90%}
.code{font-size:26px;letter-spacing:4px;font-weight:700;color:var(--brand)}
</style>
</head>
<body>
<header><div><b id="hname">PG Mate</b><small id="hsub">Your PG, sorted</small></div><button class="ghost sm" id="out" style="display:none;color:var(--on);border-color:var(--on)" onclick="logout()">Log out</button></header>
<main id="app"></main>
<nav id="nav" style="display:none"></nav>
<div id="toast" role="status"></div>
<script>
// For the Android app (Capacitor), set this to your deployed backend, e.g. 'https://pgmate.onrender.com'
window.API_BASE = window.API_BASE || '';
const API = window.API_BASE;
const MEALS = ['breakfast', 'lunch', 'dinner'];
let token = localStorage.getItem('pgmate_token'), me = null, tab = 'home', authMode = 'login';
const $ = (id) => document.getElementById(id);
const v = (id) => ($(id) ? $(id).value.trim() : '');
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const today = () => new Date().toLocaleDateString('en-CA');
const cls = (s) => String(s).replace(/\s/g, '');
const rupee = (n) => '₹' + Number(n).toLocaleString('en-IN');

async function api(path, method = 'GET', body) {
  const r = await fetch(API + '/api' + path, {
    method,
    headers: { 'Content-Type': 'application/json', ...(token ? { Authorization: 'Bearer ' + token } : {}) },
    body: body ? JSON.stringify(body) : undefined,
  });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) { if (r.status === 401 && token) logout(); throw new Error(d.error || 'Something went wrong'); }
  return d;
}
function toast(m) { const t = $('toast'); t.textContent = m; t.style.display = 'block'; setTimeout(() => (t.style.display = 'none'), 2600); }
async function run(fn) { try { await fn(); } catch (e) { toast(e.message); } }

// ---------- Auth ----------
function logout() { localStorage.removeItem('pgmate_token'); token = null; me = null; boot(); }
function authView() {
  $('nav').style.display = 'none'; $('out').style.display = 'none';
  $('hname').textContent = 'PG Mate'; $('hsub').textContent = 'Your PG, sorted';
  const m = authMode;
  $('app').innerHTML = `
  <div class="tabs">
    <button class="${m === 'login' ? '' : 'ghost'}" onclick="authMode='login';authView()">Log in</button>
    <button class="${m === 'join' ? '' : 'ghost'}" onclick="authMode='join';authView()">Join my PG</button>
    <button class="${m === 'owner' ? '' : 'ghost'}" onclick="authMode='owner';authView()">I own a PG</button>
  </div>
  <div class="card">
    ${m !== 'login' ? '<label>Your name</label><input id="a_name" autocomplete="name">' : ''}
    ${m === 'owner' ? '<label>PG name</label><input id="a_pg">' : ''}
    ${m === 'join' ? '<label>PG code (from your owner)</label><input id="a_code" autocapitalize="characters"><label>Room number</label><input id="a_room">' : ''}
    <label>Email</label><input id="a_email" type="email" autocomplete="email">
    <label>Password</label><input id="a_pass" type="password" autocomplete="${m === 'login' ? 'current-password' : 'new-password'}">
    <button onclick="submitAuth()">${m === 'login' ? 'Log in' : m === 'join' ? 'Join PG' : 'Create my PG'}</button>
  </div>`;
}
function submitAuth() {
  run(async () => {
    const base = { email: v('a_email'), password: $('a_pass').value };
    let d;
    if (authMode === 'login') d = await api('/login', 'POST', base);
    else if (authMode === 'join') d = await api('/join', 'POST', { ...base, name: v('a_name'), code: v('a_code'), room: v('a_room') });
    else d = await api('/register-owner', 'POST', { ...base, name: v('a_name'), pgName: v('a_pg') });
    token = d.token; localStorage.setItem('pgmate_token', token); boot();
  });
}

// ---------- Shell ----------
async function boot() {
  if (!token) return authView();
  try { me = await api('/me'); } catch { return authView(); }
  $('hname').textContent = me.pgName; $('hsub').textContent = `${me.name} · ${me.role === 'owner' ? 'Owner' : 'Room ' + (me.room || '-')}`;
  $('out').style.display = 'block';
  const tabs = [['home', 'Meals'], ['notices', 'Notices'], ['complaints', 'Issues'], ['rent', 'Rent']];
  if (me.role === 'owner') tabs.push(['pg', 'My PG']);
  $('nav').style.display = 'flex';
  $('nav').innerHTML = tabs.map(([k, n]) => `<button class="${tab === k ? 'on' : ''}" onclick="tab='${k}';boot()">${n}</button>`).join('');
  run(async () => { $('app').innerHTML = await views[tab](); });
}
const isOwner = () => me.role === 'owner';

// ---------- Views ----------
const views = {
  async home() {
    const d = today();
    const [m, s] = await Promise.all([api('/menu?date=' + d), api('/skips?date=' + d)]);
    if (isOwner()) {
      return `<h2>Today's menu</h2><div class="card">${MEALS.map((x) => `<label>${x}</label><input id="m_${x}" value="${esc(m[x])}">`).join('')}
        <button onclick="saveMenu()">Save menu</button></div>
        <h2>How many are eating today</h2><div class="card">${MEALS.map((x) => `<div class="row"><span>${x}</span>
        <span><b>${s.residents - (s.counts[x] || 0)}</b> eating <small>(${s.counts[x] || 0} skipping)</small></span></div>`).join('')}</div>`;
    }
    return `<h2>Today's menu</h2><div class="card">${MEALS.map((x) => {
      const skip = s.mine.includes(x);
      return `<div class="row"><div><small>${x}</small><br>${esc(m[x]) || '<span class="mute">Not added yet</span>'}</div>
        <button class="sm ${skip ? '' : 'ghost'}" onclick="toggleSkip('${x}')">${skip ? 'Skipping' : 'Skip'}</button></div>`;
    }).join('')}</div><p class="mute">Tell your owner early if you will not eat, so food is not wasted.</p>`;
  },
  async notices() {
    const list = await api('/notices');
    return `${isOwner() ? `<h2>Post a notice</h2><div class="card"><label>Title</label><input id="n_t"><label>Details</label><textarea id="n_b" rows="3"></textarea>
      <button onclick="postNotice()">Post notice</button></div>` : ''}
      <h2>Notices</h2>${list.length ? list.map((n) => `<div class="card"><b>${esc(n.title)}</b><br>${esc(n.body)}<br><small>${esc(n.created_at.slice(0, 10))}</small></div>`).join('') : '<p class="mute">No notices yet.</p>'}`;
  },
  async complaints() {
    const list = await api('/complaints');
    const form = isOwner() ? '' : `<h2>Report a problem</h2><div class="card"><label>What is it about?</label>
      <select id="c_cat"><option>Water</option><option>WiFi</option><option>Electricity</option><option>Cleaning</option><option>Food</option><option>Other</option></select>
      <label>Describe the problem</label><textarea id="c_desc" rows="3"></textarea><button onclick="postComplaint()">Send complaint</button></div>`;
    return `${form}<h2>${isOwner() ? 'All complaints' : 'My complaints'}</h2>${list.length ? list.map((c) => `<div class="card">
      <div class="row"><b>${esc(c.category)}</b><span class="tag ${cls(c.status)}">${esc(c.status)}</span></div>${esc(c.description)}
      <br><small>${isOwner() ? esc(c.user_name) + ' · Room ' + esc(c.room) + ' · ' : ''}${esc(c.created_at.slice(0, 10))}</small>
      ${isOwner() ? `<br><select onchange="setStatus(${c.id},this.value)">${['Open', 'In progress', 'Fixed'].map((s) => `<option ${s === c.status ? 'selected' : ''}>${s}</option>`).join('')}</select>` : ''}</div>`).join('') : '<p class="mute">Nothing here. Good news.</p>'}`;
  },
  async rent() {
    const list = await api('/rents');
    const form = isOwner() ? `<h2>Create rent for a month</h2><div class="card"><label>Month</label><input id="r_m" type="month" value="${today().slice(0, 7)}">
      <label>Rent per resident (₹)</label><input id="r_a" type="number" min="1"><button onclick="createRent()">Create for all residents</button></div>` : '';
    return `${form}<h2>Rent</h2>${list.length ? `<div class="card">${list.map((r) => `<div class="row"><div><b>${esc(r.month)}</b> ${rupee(r.amount)}
      ${isOwner() ? `<br><small>${esc(r.user_name)} · Room ${esc(r.room)}</small>` : ''}</div>
      <div><span class="tag ${r.status}">${r.status}</span>${isOwner() ? ` <button class="sm ghost" onclick="markPaid(${r.id},${r.status !== 'Paid'})">${r.status === 'Paid' ? 'Undo' : 'Mark paid'}</button>` : ''}</div></div>`).join('')}</div>` : '<p class="mute">No rent entries yet.</p>'}`;
  },
  async pg() {
    const list = await api('/residents');
    return `<h2>Invite code</h2><div class="card"><div class="code">${esc(me.code)}</div><p class="mute">Share this code. Residents choose "Join my PG" and enter it.</p></div>
      <h2>Residents (${list.length})</h2><div class="card">${list.length ? list.map((r) => `<div class="row"><span>${esc(r.name)}</span><small>Room ${esc(r.room) || '-'}</small></div>`).join('') : '<span class="mute">No one has joined yet.</span>'}</div>`;
  },
};

// ---------- Actions ----------
const saveMenu = () => run(async () => { await api('/menu', 'PUT', { date: today(), breakfast: v('m_breakfast'), lunch: v('m_lunch'), dinner: v('m_dinner') }); toast('Menu saved'); });
const toggleSkip = (meal) => run(async () => { const r = await api('/skips', 'POST', { date: today(), meal }); toast(r.skipped ? 'Meal skipped' : 'Skip removed'); boot(); });
const postNotice = () => run(async () => { await api('/notices', 'POST', { title: v('n_t'), body: v('n_b') }); toast('Notice posted'); boot(); });
const postComplaint = () => run(async () => { await api('/complaints', 'POST', { category: v('c_cat'), description: v('c_desc') }); toast('Complaint sent'); boot(); });
const setStatus = (id, status) => run(async () => { await api('/complaints/' + id, 'PATCH', { status }); toast('Status updated'); boot(); });
const createRent = () => run(async () => { const r = await api('/rents', 'POST', { month: v('r_m'), amount: Number(v('r_a')) }); toast(`Rent created for ${r.created} residents`); boot(); });
const markPaid = (id, paid) => run(async () => { await api('/rents/' + id, 'PATCH', { paid }); boot(); });

boot();
</script>
</body>
</html>
